name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Shell lint
        run: |
          set -euo pipefail
          bash -n platforms/linux/ubuntu/computer-use/scripts/*.sh .githooks/pre-push
          shellcheck platforms/linux/ubuntu/computer-use/scripts/*.sh .githooks/pre-push

      - name: Python compile
        run: python3 -m py_compile platforms/linux/ubuntu/computer-use/scripts/*.py

      - name: Skill documentation
        run: |
          set -euo pipefail
          python3 platforms/linux/ubuntu/computer-use/scripts/check-skill-docs.py
          python3 platforms/linux/ubuntu/computer-use/scripts/check-skill-docs-self-test.py

      - name: Plugin resource guards
        run: |
          python3 platforms/linux/ubuntu/computer-use/scripts/check-plugin-resource-guards.py
          python3 platforms/linux/ubuntu/computer-use/scripts/check-plugin-resource-guards-self-test.py

      - name: Local plugin checks
        run: |
          set -euo pipefail
          for package in \
            platforms/linux/ubuntu/computer-use/plugins/codex-usage \
            platforms/linux/ubuntu/computer-use/plugins/codex-fallback \
            platforms/linux/ubuntu/computer-use/plugins/source-control; do
            npm --prefix "$package" ci --ignore-scripts
            npm --prefix "$package" run check
          done

      - name: Documentation gate self-test
        run: python3 platforms/linux/ubuntu/computer-use/scripts/check-doc-coverage-self-test.py

      - name: Documentation gate
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DOC_BASE" ] || [ "$DOC_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base; running completeness only."
            python3 platforms/linux/ubuntu/computer-use/scripts/check-doc-coverage.py
          else
            python3 platforms/linux/ubuntu/computer-use/scripts/check-doc-coverage.py --base "$DOC_BASE" --head "$DOC_HEAD"
          fi
