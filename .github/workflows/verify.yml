name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          workspace=platforms/linux/ubuntu/computer-use/plugins-v2
          browser_tools=platforms/linux/ubuntu/browser-tools
          wrapper=platforms/linux/ubuntu/computer-use/scripts/run-bounded-command.sh
          bash "$wrapper" -- npm --prefix "$workspace" ci --ignore-scripts
          bash "$wrapper" -- npm --prefix "$browser_tools" ci --ignore-scripts

      - name: Focused repository QA self-test
        run: python3 platforms/linux/ubuntu/computer-use/scripts/check-repository-qa-self-test.py

      - name: Canonical repository QA
        run: python3 platforms/linux/ubuntu/computer-use/scripts/check-repository-qa.py

      - name: Documentation gate
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DOC_BASE" ] || [ "$DOC_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base; running completeness only."
            python3 platforms/linux/ubuntu/computer-use/scripts/check-doc-coverage.py
          else
            python3 platforms/linux/ubuntu/computer-use/scripts/check-doc-coverage.py --base "$DOC_BASE" --head "$DOC_HEAD"
          fi
